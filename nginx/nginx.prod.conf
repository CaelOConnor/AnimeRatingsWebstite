# Production reverse proxy + TLS termination.
#
# Replace every "your-domain-here.com" below with the real domain once DNS
# actually points at this host — nginx won't start correctly against a
# placeholder domain that has no matching certificate on disk.
#
# This is a full nginx.conf (bind-mounted directly to /etc/nginx/nginx.conf
# by docker-compose.prod.yml), not a conf.d fragment — it deliberately
# doesn't include the image's default conf.d/*.conf.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Multer's own limit (routes/users.js) is 2MB for avatar uploads —
    # nginx's default (1MB) would reject those with a 413 before the
    # request ever reaches the backend. A little headroom over 2MB covers
    # multipart boundary/header overhead.
    client_max_body_size 3m;

    # ── Port 80 — ACME challenge + redirect everything else ───────────────
    # /.well-known/acme-challenge/ must stay plain HTTP: certbot's service
    # (docker-compose.prod.yml) renews via the webroot method against the
    # certbot-webroot volume, which this location serves from — the same
    # volume certbot writes challenge files into. Redirecting this path to
    # HTTPS would break every future renewal.
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain-here.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Port 443 — TLS termination + reverse proxy ─────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name your-domain-here.com;

        # Matches what certbot actually writes, not an assumption: the
        # certbot service mounts ./nginx/ssl (host) -> /etc/letsencrypt
        # (its own container path) and uses certbot's standard layout,
        # /etc/letsencrypt/live/<domain>/{fullchain,privkey}.pem. This nginx
        # service mounts that SAME host directory at a different container
        # path — /etc/nginx/ssl (see docker-compose.prod.yml) — so from
        # here those same files are under /etc/nginx/ssl/live/<domain>/,
        # never /etc/letsencrypt/... (that path doesn't exist in this
        # container at all).
        ssl_certificate     /etc/nginx/ssl/live/your-domain-here.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/your-domain-here.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Real client IP/proto through to the backend — without these the
        # rate limiter (express-rate-limit, keyed by IP — see
        # backend/middleware/rateLimit.js) would see every request as
        # coming from this nginx container instead of the real client.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backend API — every route in backend/app.js is mounted under
        # /api (routes/*.js, plus /api/hello and /api/health).
        location /api/ {
            proxy_pass http://backend:3001;
        }

        # Avatar uploads — served by the backend's own express.static
        # (app.js: app.use('/uploads', express.static(...))), not part of
        # the frontend build. The frontend requests these as
        # `${VITE_API_URL}${avatar_url}` — i.e. against this same public
        # origin (see frontend/src/pages/UserProfile.jsx's Avatar
        # component) — so this needs its own proxy location. Falling
        # through to the frontend below would 404: its SPA fallback serves
        # index.html for anything unmatched, not the actual image file.
        location /uploads/ {
            proxy_pass http://backend:3001;
        }

        # Everything else — the built React SPA, served by the frontend
        # container's own nginx (frontend/nginx.conf), which already
        # handles client-side routing fallback to index.html.
        location / {
            proxy_pass http://frontend:80;
        }
    }
}

# docker-compose.prod.yml
# Production overrides — used on Digital Ocean
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.9'

services:

  frontend:
    build:
      target: production
    ports: !reset []        # Nginx handles routing, don't expose directly
    environment:
      - VITE_API_URL=${PROD_API_URL}

  backend:
    build:
      target: production
    ports: !reset []        # Nginx handles routing, don't expose directly
    environment:
      - NODE_ENV=production
      # No fallback here on purpose — the base compose file's CORS_ORIGIN
      # default (http://localhost:5173) must never reach a production
      # container. This overrides that key (environment merges per-key) and
      # fails `docker compose up`/`config` immediately if unset, before the
      # app.js startup check even runs.
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN must be set in the prod .env — refusing to fall back to the dev default}
      # Overrides the base file's DB_USER/DB_PASSWORD (owner-level, used for
      # schema setup and local dev convenience) with the least-privilege
      # role created by backend/db/init-app-role.sh — SELECT/INSERT/UPDATE/
      # DELETE on the app's own tables only, no DDL/ownership. A future
      # SQL-injection-class bug in prod can't DROP/CREATE anything.
      - DB_USER=${DB_APP_USER:?DB_APP_USER must be set in the prod .env}
      - DB_PASSWORD=${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set in the prod .env}
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    ports: !reset []        # Never expose postgres publicly in prod
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    ports: !reset []        # Never expose redis publicly in prod
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    # Pinned to a digest — see docker-compose.yml's postgres entry for the
    # tradeoff/update procedure. Same underlying image as frontend/Dockerfile's
    # production stage, so they share one digest to update together.
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Let's Encrypt certs go here
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - showrater-network
    restart: unless-stopped

  certbot:
    # Was implicitly `:latest` (no tag = latest) — the most volatile floating
    # reference possible, since it can silently jump major versions on a
    # rebuild, not just pick up patches. Pinned to a digest for the same
    # reproducibility reason as the other images here.
    image: certbot/certbot@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-webroot:
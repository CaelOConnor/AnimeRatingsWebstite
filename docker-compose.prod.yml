# docker-compose.prod.yml
# Production overrides — used on Digital Ocean
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.9'

services:

  frontend:
    build:
      target: production
    ports: !reset []        # Nginx handles routing, don't expose directly
    environment:
      - VITE_API_URL=${PROD_API_URL}

  backend:
    build:
      target: production
    ports: !reset []        # Nginx handles routing, don't expose directly
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    ports: !reset []        # Never expose postgres publicly in prod
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    ports: !reset []        # Never expose redis publicly in prod
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # Let's Encrypt certs go here
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - showrater-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-webroot: